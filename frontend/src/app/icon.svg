<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="60" y1="0" x2="452" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Outer gradient border -->
  <rect x="3" y="3" width="506" height="506" rx="98" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.6"/>

  <!-- Circuit node dots — top left cluster -->
  <circle cx="80" cy="80" r="5" fill="#38bdf8" opacity="0.4"/>
  <circle cx="112" cy="80" r="3" fill="#818cf8" opacity="0.3"/>
  <line x1="85" y1="80" x2="109" y2="80" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>
  <line x1="80" y1="85" x2="80" y2="108" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>
  <circle cx="80" cy="112" r="3" fill="#38bdf8" opacity="0.3"/>

  <!-- Circuit node dots — bottom right cluster -->
  <circle cx="432" cy="432" r="5" fill="#a78bfa" opacity="0.4"/>
  <circle cx="400" cy="432" r="3" fill="#818cf8" opacity="0.3"/>
  <line x1="427" y1="432" x2="403" y2="432" stroke="#a78bfa" stroke-width="1.5" opacity="0.3"/>
  <line x1="432" y1="427" x2="432" y2="404" stroke="#a78bfa" stroke-width="1.5" opacity="0.3"/>
  <circle cx="432" cy="400" r="3" fill="#a78bfa" opacity="0.3"/>

  <!-- Subtle horizontal scan line -->
  <rect x="60" y="254" width="392" height="1" fill="url(#accent)" opacity="0.08"/>

  <!-- Main "FFV" lettering -->
  <text
    x="256"
    y="310"
    text-anchor="middle"
    fill="url(#text-grad)"
    font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif"
    font-weight="800"
    font-size="196"
    letter-spacing="-4"
    filter="url(#glow)"
  >FFV</text>

  <!-- Gradient underline bar -->
  <rect x="128" y="330" width="256" height="5" rx="2.5" fill="url(#accent)" opacity="0.9"/>

  <!-- "ACADEMY" small label -->
  <text
    x="256"
    y="388"
    text-anchor="middle"
    fill="#94a3b8"
    font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif"
    font-weight="600"
    font-size="42"
    letter-spacing="10"
  >ACADEMY</text>

  <!-- Corner accent — top right -->
  <path d="M 432 60 L 452 60 L 452 80" stroke="url(#accent)" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Corner accent — bottom left -->
  <path d="M 80 452 L 60 452 L 60 432" stroke="url(#accent)" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
