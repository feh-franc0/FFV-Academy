<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <linearGradient id="icon-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="icon-accent" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="text-accent" x1="80" y1="0" x2="320" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Icon mark background -->
  <rect width="64" height="64" rx="14" fill="url(#icon-bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#icon-accent)" stroke-width="1.5" opacity="0.6"/>

  <!-- FFV in icon -->
  <text
    x="32"
    y="44"
    text-anchor="middle"
    fill="white"
    font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif"
    font-weight="800"
    font-size="24"
    letter-spacing="-0.5"
  >FFV</text>
  <!-- Underline in icon -->
  <rect x="14" y="48" width="36" height="2" rx="1" fill="url(#icon-accent)"/>

  <!-- Wordmark: "FFV" bold -->
  <text
    x="80"
    y="42"
    fill="url(#text-accent)"
    font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif"
    font-weight="800"
    font-size="28"
    letter-spacing="-0.5"
  >FFV</text>

  <!-- Wordmark: "Academy" regular weight -->
  <text
    x="133"
    y="42"
    fill="#e2e8f0"
    font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif"
    font-weight="400"
    font-size="28"
    letter-spacing="-0.3"
  > Academy</text>

  <!-- Subtle tagline -->
  <text
    x="81"
    y="58"
    fill="#64748b"
    font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif"
    font-weight="500"
    font-size="10"
    letter-spacing="1.5"
  >ENGENHARIA · IA · AWS</text>
</svg>
