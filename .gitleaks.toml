title = "gitleaks — FFV Academy"

# Achado P-11 (auditoria de segurança, 11/ago/2026): `gitleaks-action` em
# `.github/workflows/security.yml` rodava com `continue-on-error: true` —
# um leak real seria reportado, mas nunca bloquearia o CI. A causa era esta:
# sem allowlist, os 6 falsos positivos abaixo (conteúdo didático da própria
# plataforma, não segredo real) reprovavam TODA execução, e `continue-on-
# error` existia só pra absorver esse ruído permanente. Com o allowlist
# explícito, `continue-on-error` foi removido — um achado NOVO volta a
# bloquear o build, que é o comportamento que a regra existe pra garantir.
#
# Cada entrada abaixo foi triada manualmente (verificado o commit, o arquivo
# e o valor) antes de entrar aqui. Nenhuma delas é segredo — allowlist por
# REGEX do valor exato, não por rule-id nem por arquivo inteiro, pra não
# abrir uma exceção larga demais que esconderia um segredo real introduzido
# depois no mesmo arquivo.

[extend]
useDefault = true

[allowlist]
description = "Falsos positivos confirmados: conteúdo didático da plataforma (exemplos de protocolo/código em artigos), não segredo real."
regexes = [
  # RFC 6455 §1.3 — o nonce de EXEMPLO do handshake WebSocket, citado
  # literalmente em dois artigos de rede/produção (websockets-producao-deep).
  '''dGhlIHNhbXBsZSBub25jZQ==''',
  # docker-compose.yml (dev local) — valor é a string literal "placeholder",
  # nunca uma chave Stripe real; STRIPE_SECRET_KEY de produção vem de
  # /opt/ffv/.env na VPS, fora do repositório.
  '''sk_test_placeholder''',
  # jwt-vs-paseto-sessions — trecho de código Python de exemplo mostrando a
  # API do paseto.decode(), não um segredo.
  '''implicit_assertion=b'''
]
paths = [
  # "LinkedIn Criador: posicionamento..." — falso positivo da regra
  # linkedin-client-id sobre texto de marketing de conteúdo, não uma
  # credencial OAuth do LinkedIn.
  '''frontend/src/app/aprenda/conteudo-tutorial-tecnico/page\.tsx''',
  # MIGRATION_DONE_KEY é o NOME de uma constante de localStorage
  # (game-state-storage.ts) — a regra generic-api-key reage à palavra "KEY"
  # no nome, não ao valor 'ffv_idb_migrated_v1', que não é segredo.
  '''frontend/src/lib/game-state-storage\.ts''',
]
