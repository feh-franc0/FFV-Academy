# Config para actions/labeler@v5 — usado por .github/workflows/pr-checks.yml.
# Labels precisam existir no repo (criar manualmente uma vez).
frontend:
  - changed-files:
      - any-glob-to-any-file:
          - 'frontend/**'

backend:
  - changed-files:
      - any-glob-to-any-file:
          - 'backend/**'

infra:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'scripts/**'
          - '**/Dockerfile'
          - '**/docker-compose*.yml'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'

mcp:
  - changed-files:
      - any-glob-to-any-file:
          - 'mcp/**'

video-pipeline:
  - changed-files:
      - any-glob-to-any-file:
          - 'video-pipeline/**'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'backend/go.mod'
          - 'backend/go.sum'
          - '**/package.json'
          - '**/package-lock.json'
