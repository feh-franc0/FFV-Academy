name: 'Setup Node + caches'
description: 'Setup Node.js + npm ci + caches de Vite/Vitest e Playwright browsers. Espera que o checkout já tenha rodado.'

inputs:
  working-directory:
    description: 'Diretório com package.json/package-lock.json.'
    required: false
    default: 'frontend'
  node-version:
    description: 'Versão do Node.'
    required: false
    default: '20'
  install-playwright:
    description: 'Se "true", restaura/instala browsers do Playwright (somente chromium).'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Restore Vite/Vitest cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ inputs.working-directory }}/node_modules/.vite
          ${{ inputs.working-directory }}/node_modules/.vitest
        key: ${{ runner.os }}-vite-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-vite-

    - name: npm ci
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Restore Playwright browsers
      if: inputs.install-playwright == 'true'
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        # Chave baseada no package-lock para invalidar quando a versão do @playwright/test mudar.
        key: ${{ runner.os }}-playwright-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Playwright browsers (chromium)
      if: inputs.install-playwright == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Mesmo com cache hit, garantimos que as dependências de sistema estejam presentes.
      run: |
        if [[ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" ]]; then
          npx playwright install-deps chromium
        else
          npx playwright install --with-deps chromium
        fi
