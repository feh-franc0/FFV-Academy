name: 'Setup Go + caches'
description: 'Checkout-free setup: configura Go, baixa módulos, restaura caches de build e go-mod. Espera que o checkout já tenha rodado.'

inputs:
  working-directory:
    description: 'Diretório do módulo Go (onde está o go.mod).'
    required: false
    default: 'backend'
  cache-key-suffix:
    description: 'Sufixo opcional para isolar caches entre jobs (ex: "test", "lint").'
    required: false
    default: 'default'

runs:
  using: 'composite'
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ inputs.working-directory }}/go.mod
        # setup-go@v5 já cacheia ~/go/pkg/mod via go.sum; mantemos isso.
        cache-dependency-path: ${{ inputs.working-directory }}/go.sum

    - name: Restore Go build cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
        key: ${{ runner.os }}-go-build-${{ inputs.cache-key-suffix }}-${{ hashFiles(format('{0}/go.sum', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-go-build-${{ inputs.cache-key-suffix }}-
          ${{ runner.os }}-go-build-

    - name: Download dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go mod download
