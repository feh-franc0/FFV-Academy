name: Lighthouse CI

on:
  pull_request:
    branches: [main]

# Achado P-11 (auditoria de 11/ago/2026): sem `permissions:` explícito, o
# GITHUB_TOKEN herda o escopo default (frequentemente read-write em vários
# recursos) ao rodar build de um PR — inclusive de fork não confiável. Este
# workflow só faz checkout + build + upload pra storage temporário externo do
# Lighthouse; não precisa escrever nada de volta no repositório.
permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: frontend/.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
