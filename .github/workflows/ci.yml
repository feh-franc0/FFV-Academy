name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: npm run bundlesize:check
        continue-on-error: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffv-academy-build-${{ github.sha }}
          path: frontend/out/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: frontend/playwright-report/
          retention-days: 7

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ffv
          POSTGRES_PASSWORD: ffv
          POSTGRES_DB: ffv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ffv -d ffv_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ffv:ffv@localhost:5432/ffv_test?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/migrate
          migrate -version

      - name: Run migrations
        run: make migrate

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v7
        with:
          # Pinada na v2.12.2 (06/mai/2026) — compatível com Go 1.26.
          # `latest` do action ainda aponta para v1.64.8 (build com Go 1.24)
          # que falha ao parsear código Go 1.25+.
          version: v2.12.2
          working-directory: backend
          # --build-tags=security garante que helpers de test/security/ não
          # apareçam como "unused" — eles só são consumidos com a tag ligada.
          args: --timeout=5m --build-tags=security

      - name: Vulnerability check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || echo "::warning::govulncheck encontrou vulnerabilidades — revisar"

      - name: Unit tests
        run: make test-unit

      - name: Contract tests
        run: make test-contract

      - name: Security tests (8 categories — pentest suite)
        # Bateria profissional: feature flag bypass, auth bypass, rate limit,
        # input validation, security headers, error handling, webhook security,
        # data exposure. 60+ test cases. Equivalente a um pentest automatizado.
        env:
          # Redis disponível via service container — habilita os 3 testes
          # de rate limit que pulam se Redis estiver ausente
          REDIS_URL: redis://localhost:6379/15
        run: make test-security

      - name: Integration tests
        run: |
          if ls test/integration/*.go >/dev/null 2>&1; then
            go test ./test/integration/... -timeout 180s -tags integration
          else
            echo "No integration tests found — skipping."
          fi

      - name: Coverage
        run: make test-cover

      - name: Coverage gate (ratchet — não permite regressão)
        run: |
          # Baseline atual: 25% (mai/2026). Esta é uma "ratchet": o gate
          # impede que o coverage CAIA abaixo do mínimo. À medida que novos
          # testes são adicionados, o threshold sobe gradualmente (sem
          # bloquear PRs que adicionam features hoje).
          #
          # Plano de evolução:
          #   - mai/2026: 25%  (atual — pentest suite + unit/contract/integration)
          #   - jul/2026: 40%  (após testes de handlers HTTP completos)
          #   - set/2026: 60%  (após testes de infrastructure layer)
          #   - dez/2026: 75%  (target final para code que importa)
          MIN_COVERAGE=25
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage total: ${COVERAGE}% (mínimo atual: ${MIN_COVERAGE}%)"
          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% abaixo do baseline (${MIN_COVERAGE}%) — regressão detectada"
            exit 1
          fi
          echo "✓ Coverage gate OK"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.sha }}
          path: |
            backend/coverage.out
            backend/coverage.html
          retention-days: 14
