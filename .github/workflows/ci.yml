name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Em PR, cancela runs anteriores do MESMO PR.
  # Em push para main, cada commit gera um run independente.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Detector de mudanças ─────────────────────────────────────────────────
  # Decide quais jobs devem rodar. Jobs gateados por isso usam `if`, mas o
  # status final fica consolidado em `ci-success` (sempre executa) — assim
  # path filters NÃO transformam required checks em "skipped" no GitHub.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # dorny/paths-filter usa pulls.listFiles em PRs — exige read em pull-requests.
    # Sem isso, PRs do Dependabot quebram com "Resource not accessible by integration"
    # (token do Dependabot tem permissões reduzidas por design).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-node/**'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-go/**'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'

  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          working-directory: frontend

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      # Garante que cada slug declarado em curriculum.ts tem o JSON
      # correspondente em scripts/seeds/articles/. Sem isso, o importer
      # do deploy não persiste nada para /aprenda/<slug> → 404 em prod.
      # --strict desde ago/2026: o débito de conteúdo foi zerado (AIF-C01 e
      # Anthropic AI Practitioner produzidas), então todo slug declarado tem
      # página. Daqui em diante, declarar módulo sem escrever o conteúdo quebra o
      # build em vez de virar um 404 silencioso em produção.
      - name: Curriculum ↔ seeds drift check
        working-directory: ${{ github.workspace }}
        run: node scripts/check-curriculum-seed-drift.mjs --strict

      # Gates de conteúdo do PADRAO_ENSINO.md. Estavam documentados como "no CI"
      # sem estar — a lição da cobertura silenciosamente parcial, de novo: gate
      # que só roda na máquina de quem lembra é um verde em que ninguém pode
      # confiar. Cada um falha o build por um motivo distinto:
      #   - blocks: bloco malformado desaparece da página sem erro (Zod → null)
      #   - quiz:   módulo de certificação sem 3 quizzes não gera carta de SRS
      #   - diagramas: trilha de arquitetura abaixo do mínimo declarado
      #   - servicos:  serviço catalogado e nunca explicado no conteúdo
      - name: Content gate — blocos válidos
        working-directory: ${{ github.workspace }}
        run: python3 scripts/validate_bedrock_blocks.py

      # 97 de 158 blocos `language: "json"` não faziam JSON.parse (a maioria
      # com `// comentário` antes do JSON — inválido em JSON estrito). Quem
      # copia recebe erro de sintaxe. 47 corrigidos mecanicamente
      # (corrigir_json_comentado.py); os 48 restantes exigem edição por
      # bloco (comentário inline, risco de cortar `//` de URL) — ratchet.
      - name: Content gate — código JSON copiável (faz parse)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/validate_json_code_valido.py --strict

      - name: Content gate — cobertura de quiz (SRS)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/validate_cobertura_quiz.py --strict

      # `objetivo` é o contrato "resultado, não conteúdo" que jornada.ts já
      # aplica às 5 etapas, faltando no grão do módulo — achado da auditoria
      # pedagógica de 12/ago/2026 (96% dos `desc` listavam conteúdo). Piso
      # fixo nos 38 módulos de entrada de trilha + ratchet no total.
      - name: Content gate — objetivo (resultado, não conteúdo) por módulo
        working-directory: ${{ github.workspace }}
        run: python3 scripts/validate_cobertura_objetivo.py --strict

      # 95,8% dos quizzes ficavam no último quarto do módulo antes de
      # 12/ago/2026 — retrieval practice massada, não distribuída. Ver
      # scripts/distribuir_quiz_no_meio.py para a correção aplicada.
      - name: Content gate — recuperação distribuída (não só no fim)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/validate_recuperacao_distribuida.py --strict

      - name: Content gate — cobertura de diagramas
        working-directory: ${{ github.workspace }}
        run: python3 scripts/validate_cobertura_diagramas.py --strict

      # `validate_cobertura_diagramas` mede `arch_diagram` (ícone de serviço
      # AWS) — não se aplica a Git, SQL, TypeScript, Python ou Go. Este gate
      # cobre a família ampla de visual estrutural (flow, hierarquia, matriz,
      # timeline, fórmula anotada) especificamente no hub Base técnica, que
      # tinha 0,4 visual/módulo contra 4,8 do hub AWS — medido em 09/ago/2026.
      - name: Content gate — apoio visual no hub Base técnica
        working-directory: ${{ github.workspace }}
        run: python3 scripts/validate_apoio_visual_fundamentos.py --strict

      - name: Content gate — cobertura de serviços AWS
        working-directory: ${{ github.workspace }}
        run: python3 scripts/validate_cobertura_servicos.py

      # `serviceDef()` tem fallback silencioso: chave desconhecida vira cubo
      # cinza sem erro nenhum. Foi assim que 148 nós de rede/compute/storage
      # renderizaram com a cor de "Fora da AWS" nas trilhas de certificação.
      #
      # O mesmo gate confere o selo "VPC": `kind: 'vpc'` AFIRMA isolamento de
      # rede, e usá-lo como agrupamento visual sobre serviço regional (Bedrock,
      # Knowledge Bases, S3, Athena) ensina errado a distinção que a prova cobra.
      # Eram 121 grupos assim em ago/2026 — 104 na trilha de arquiteturas e 17 na
      # base antiga.
      # Desde 07/ago/2026 este passo também imprime a BARRA DE QUALIDADE: nó sem
      # nota, aresta sem rótulo, passo fora de 5–7, kind inválido. Em modo
      # relatório (sai 0), porque a dívida medida é de 871 arestas e 218 nós —
      # ligar em falha antes de pagá-la reprovaria todo commit, e a resposta
      # previsível a isso é desligar o gate. Os números da linha de base ficam no
      # cabeçalho do script, para a descida ser verificável.
      - name: Content gate — ícone, selo de VPC honesto e barra de qualidade
        working-directory: ${{ github.workspace }}
        run: python3 scripts/validate_servicos_diagrama.py

      # Os gates acima verificam se o bloco é VÁLIDO. Este verifica se ele tem
      # CONTEÚDO na tela. A diferença valeu 1.300+ campos escritos e invisíveis
      # em 100+ módulos, descobertos em ago/2026 — inclusive 148 anotações de
      # fórmula que renderizavam caixa em branco.
      - name: Content gate — conteúdo escrito chega à página
        working-directory: ${{ github.workspace }}
        run: python3 scripts/validate_primitives_render.py

      # Os gates acima verificam validade, visibilidade e ícone. Nenhum deles
      # verificava SUBSTÂNCIA: seis módulos de System Design eram esboços
      # telegráficos — "Fan-out on write vs read vs hybrid. Celebrity problem."
      # era a seção inteira — e passavam em todos.
      # O índice leve é gerado e commitado. Sem esta checagem ele descreve um
      # currículo do passado, e `useGameState` calcula progresso e recomendações
      # a partir dele — o sintoma seria porcentagem errada e recomendação de
      # módulo que não existe mais.
      - name: Content gate — índice leve regenerado
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/gerar-indice-leve.mjs
          git diff --exit-code frontend/src/lib/curriculum/indice-leve.ts \
            || (echo "::error::rode 'node scripts/gerar-indice-leve.mjs' e commite" && exit 1)

      - name: Content gate — módulo ensina alguma coisa
        working-directory: ${{ github.workspace }}
        run: python3 scripts/validate_substancia.py

      # O question-bank é lido pelo gerador de migration, e arquivo com prefixo
      # desconhecido era IGNORADO EM SILÊNCIO: em 09/ago/2026 havia 435 questões
      # de DVA-C02 e 115 de AIF-C01 escritas que nunca chegavam à produção.
      # O gate também cobra que `totalQuestions` seja verdade e que o gabarito
      # não concentre numa letra — havia arquivo com 87% das corretas em "A".
      - name: Content gate — question-bank legível, honesto e sem gabarito viciado
        working-directory: ${{ github.workspace }}
        run: python3 scripts/validate_question_bank.py --strict

      # O gate acima cobre `frontend/data/question-bank/` (1.565 questões de
      # simulado) e reprova acima de 45% numa letra. Ele NUNCA olhou os 1.472
      # quizzes dos SEEDS — que são a única fonte de cartas do SRS. Medido em
      # 12/ago/2026: 92,6% das corretas no índice 1 e a correta era a
      # alternativa mais longa em 93,4%; "marque a B ou a mais longa" acertava
      # ~98% sem ler o enunciado, e cada carta de SM-2 herdava o artefato.
      # Mesma régua, escopo que faltava — ver feedback "nome de gate não
      # garante escopo".
      - name: Content gate — quiz de módulo não é acertável sem ler
        working-directory: ${{ github.workspace }}
        run: python3 scripts/validate_quiz_respondivel.py

      # Os gates acima olham o bloco: válido, visível, com ícone certo, com
      # substância. Estes dois olham a FORMA DO TEXTO, que é o que decide se um
      # trecho é citável por resumo de IA — e nenhum dos anteriores enxerga.
      #
      # A lacuna é o caso mais claro: 23 frases estavam no ar como "Sim. , , .
      # API aceita campo (lista base64)" — código inline perdido em conversão.
      # Passava por build, por substância (conta caracteres), por render (o bloco
      # é válido) e pela varredura (a página responde 200 com conteúdo). Só um
      # leitor humano via.
      - name: Content gate — texto sem lacuna de trecho removido
        working-directory: ${{ github.workspace }}
        run: python3 scripts/validate_texto_sem_lacuna.py

      # Contrato de resposta citável: pergunta é pergunta, resposta começa pela
      # conclusão e se sustenta fora da página. Ver ESTRATEGIA_SEO_ORGANICO_2026-08.md.
      # Não exige a seção em todo módulo — cobertura é trabalho em andamento, e
      # gate que falha por conteúdo futuro ensina o time a desligar gate.
      # ─── Gates de 07/ago/2026 ─────────────────────────────────────────────
      #
      # O 2º elo da cadeia de render (adapter → primitive), que ficou sem
      # cobertura até três defeitos da mesma família o atravessarem: prop
      # entregue pelo adapter e não declarada pelo primitive faz o conteúdo
      # escrito DESAPARECER da tela sem erro nenhum. Alcance medido: 82 de 391
      # alternativas de `decision_box`, 148 de 197 anotações de fórmula, 282 de
      # 367 itens de `stack_flow`.
      - name: Content gate — adapter e primitive concordam
        working-directory: ${{ github.workspace }}
        run: python3 scripts/validate_adapter_primitive.py --strict

      # A série de 100 laboratórios promete TRÊS arquiteturas — mínima, produção e
      # a evolução em níveis —, seção de limpeza e entregável declarado. Sem gate, o
      # segundo diagrama vira cópia do primeiro com uma caixa a mais, a terceira
      # simplesmente não é escrita, e a limpeza some — deixando NAT Gateway ligado
      # na conta de quem seguiu o laboratório.
      - name: Content gate — série de laboratórios AWS
        working-directory: ${{ github.workspace }}
        run: python3 scripts/validate_labs_aws.py --strict

      # O gate acima confere as TRÊS arquiteturas; este confere que o laboratório
      # responde o que acontece DEPOIS que a coisa sobe — segurança, observabilidade,
      # escala, custo, Well-Architected, injeção de falha, troubleshooting, onde IA
      # entra e anti-padrões. Nove seções, e é o que separa um laboratório de
      # arquitetura de um `terraform apply` narrado. Nasceu de uma medição em
      # 09/ago/2026 que achou 88 dessas seções ausentes em 21 dos 100 laboratórios,
      # todas nas bandas 9 e 10 — as últimas escritas, quando o padrão já parecia
      # óbvio demais para reconferir. As bandas 1–8 as tinham em ~100% por disciplina
      # de quem escreveu, e disciplina não é garantia.
      - name: Content gate — cobertura das nove seções profissionais
        working-directory: ${{ github.workspace }}
        run: python3 scripts/validate_cobertura_secoes.py --strict

      # Os gates acima conferem ESTRUTURA, e um módulo raso passa em todos: os
      # campos existem, estão preenchidos e não ensinam nada. Este mede sinais de
      # profundidade — nota de nó que só repete o rótulo, explicação de quiz que só
      # gabarita, requisito que não diz o que muda no desenho, anti-padrão sem "por
      # que alguém faz", prova sem número. Toda barra foi medida em L01–L03 antes de
      # ser escrita, e cada checagem tem prova negativa. Ele NÃO prova que o módulo
      # ensina; prova que não caiu nos padrões conhecidos de superficialidade.
      # Necessário porque a série passou a ser escrita em paralelo, e escala é
      # exatamente quando a barra escorrega sem ninguém notar.
      - name: Content gate — barra de ensino dos laboratórios
        working-directory: ${{ github.workspace }}
        run: python3 scripts/validate_barra_ensino.py --strict

      # Também em relatório: 67 das 75 questões do catálogo ainda não tratam cada
      # distrator. Migrar é redação técnica, não conversão mecânica.
      - name: Content gate — explicação de simulado (relatório)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/validate_explicacao_simulado.py

      - name: Content gate — resposta citável
        working-directory: ${{ github.workspace }}
        run: python3 scripts/validate_respostas_citaveis.py

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check bundle size (por arquivo — informativo)
        run: npm run bundlesize:check
        continue-on-error: true

      # Gate REAL: soma dos chunks de firstLoad por rota crítica (o que o
      # navegador baixa), não o maior arquivo isolado. Sem continue-on-error —
      # este é o gate que bloqueia. Ver frontend/scripts/check-route-bundle.mjs
      # para o porquê e a prova negativa (regressão do currículo completo
      # detectada e revertida em 11/ago/2026, na mesma mudança que criou o gate).
      - name: Check bundle budget per route
        run: npm run bundle:check

      # Gate do achado P-16 (ago/2026): CodePlayground foi quarentenado em
      # drafts/ por rodar new Function() sobre código não confiável e
      # carregar runtimes de CDN fora da CSP. Este gate falha se qualquer
      # chunk de produção voltar a referenciar essas URLs — não depende de
      # "ninguém importar de novo", mede o bundle real.
      - name: Check no code-execution CDNs in production bundle
        run: npm run check:no-code-execution-cdns

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffv-academy-build-${{ github.sha }}
          path: frontend/.next/standalone/
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Frontend"
            echo ""
            echo "- Node: \`$(node --version)\`"
            echo "- Lint: \`npm run lint\`"
            echo "- Tests: \`npm test\`"
            echo "- Build artifact: \`ffv-academy-build-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── Empacotamento da imagem ──────────────────────────────────────────────
  #
  # O job que prova o que o `build` NÃO prova. `npm run build` valida o
  # compilador; a varredura valida `next start`, que lê de `.next/`. O contêiner
  # roda o servidor standalone, e ele depende de `.next/static` e `public` terem
  # sido COPIADOS pelo Dockerfile — duas linhas que nenhum outro job exercita.
  #
  # Apagar `COPY --from=builder /app/.next/static` deixa o build verde, a
  # varredura verde, e a página sobe sem CSS para o primeiro visitante.
  imagem_frontend:
    name: Imagem do frontend (empacotamento)
    runs-on: ubuntu-latest
    needs: [changes, frontend]
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Constrói com o MESMO Dockerfile do deploy, sobe com o MESMO comando de
      # entrada, e confere home, módulo com CSS aplicado, estático e saúde.
      - name: Teste de fumaça contra a imagem
        run: scripts/smoke-imagem-frontend.sh

  # ─── E2E (Playwright) ─────────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [changes, frontend]
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node + Playwright
        uses: ./.github/actions/setup-node
        with:
          working-directory: frontend
          install-playwright: 'true'

      - name: Build (E2E mode)
        # NEXT_PUBLIC_E2E_TESTING=true ativa o caminho mock do auth (token 000000)
        # mesmo com NODE_ENV=production. Sem isso, login mágico nos testes E2E
        # falha pois o guard de produção bloqueia o token mock por segurança.
        env:
          NEXT_PUBLIC_E2E_TESTING: 'true'
        run: npm run build

      - name: Run E2E tests
        run: npm run e2e:ci

      # Varredura de TODAS as rotas — 16 checagens sobre o build de produção
      # servido. Renderiza as 535 telas (90 estáticas + 19 temas + 426 módulos) em
      # navegador de verdade, com o console escutado.
      #
      # É a única checagem que exercita o BUILD DE PRODUÇÃO servido — os testes de
      # unidade renderizam componente, não página. O que ela já achou, e nenhum
      # teste de componente pegava:
      #
      #   · as 415 páginas pré-renderizando como "Módulo não encontrado" quando o
      #     build não alcança o backend;
      #   · o conflito entre a <meta> de CSP e o header HTTP;
      #   · incompatibilidade de hidratação (React #418) em rota de simulado;
      #   · `og:image` AUSENTE nas 426 páginas de módulo;
      #   · três violações sérias de acessibilidade em TODA página (barra de
      #     progresso sem nome, controle interativo aninhado, região de rolagem
      #     sem foco de teclado).
      #
      # A checagem de acessibilidade reprova qualquer violação ESTRUTURAL e mantém
      # teto por rota para contraste — dívida declarada, que só pode descer.
      #
      # A 16ª checagem exercita as 55 rotas retiradas no pivot: as 34 com
      # disposição de redirect têm de emitir permanente com o `Location` declarado
      # E o destino responder 200; as 21 `removido` têm de responder 404. O teste
      # de unidade prova que a tabela é coerente — só a requisição prova que o
      # servidor casa o `source` como escrito e que o destino renderiza.
      #
      # A 14ª e a 15ª nasceram da auditoria de SEO de 06/ago/2026, que achou 16
      # defeitos no `<head>` servido — todos vindos da HERANÇA de metadados, que só
      # existe depois de o Next resolver a árvore de segmentos:
      #
      #   · 58 páginas emitiam `og:url` da HOME e `twitter:title` genérico, porque
      #     herdavam o bloco do layout raiz inteiro — cada uma se anunciava como a
      #     página inicial;
      #   · 11 páginas SEM `og:image`, pela razão oposta: declararam `openGraph`
      #     sem `images`, e o bloco da página substitui o da raiz em vez de mesclar;
      #   · 12 títulos com a marca duplicada ("X — FFV Academy — FFV Academy");
      #   · 520 URLs no sitemap com o MESMO `<lastmod>` — afirmar a cada deploy que
      #     o site inteiro mudou faz o Google ignorar o campo, inclusive onde ele
      #     seria verdade.
      - name: Varredura de rotas (build de produção)
        run: npm run varredura

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ github.sha }}
          path: frontend/playwright-report/
          retention-days: 7

  # ─── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      # Quando Go 1.27 sair, adicionar aqui sem mexer em mais nada.
      # fail-fast: false garante que veremos falhas em todas as versões.
      fail-fast: false
      matrix:
        go: ['1.26']
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ffv
          POSTGRES_PASSWORD: ffv
          POSTGRES_DB: ffv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ffv -d ffv_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ffv:ffv@localhost:5432/ffv_test?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go (matrix ${{ matrix.go }}) + caches
        uses: ./.github/actions/setup-go
        with:
          working-directory: backend
          cache-key-suffix: ci-${{ matrix.go }}

      - name: Build
        run: go build ./...

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/migrate
          migrate -version

      # Drift check: se alguém editou um clf-c02-*.json sem regenerar a
      # migration, falha o CI. Garante que migrations/000042_reseed_clf_questions_v2.up.sql
      # sempre reflete o estado atual dos JSONs.
      - name: Verify seed migration is up-to-date with JSONs
        working-directory: backend
        run: |
          make gen-seed-migration
          if ! git diff --exit-code migrations/000042_reseed_clf_questions_v2.up.sql; then
            echo "::error::A migration de seed CLF-C02 está desatualizada em relação aos JSONs em frontend/data/question-bank."
            echo "::error::Rode 'make gen-seed-migration' localmente e commite o resultado."
            exit 1
          fi

      - name: Run migrations
        run: make migrate

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          # Pinada na v2.12.2 (06/mai/2026) — compatível com Go 1.26.
          # `latest` do action ainda aponta para v1.64.8 (build com Go 1.24)
          # que falha ao parsear código Go 1.25+.
          version: v2.12.2
          working-directory: backend
          # --build-tags=security garante que helpers de test/security/ não
          # apareçam como "unused" — eles só são consumidos com a tag ligada.
          args: --timeout=5m --build-tags=security

      - name: Vulnerability check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || echo "::warning::govulncheck encontrou vulnerabilidades — revisar"

      - name: Unit tests
        run: make test-unit

      - name: Contract tests
        run: make test-contract

      - name: Security tests (8 categories — pentest suite)
        # Bateria profissional: feature flag bypass, auth bypass, rate limit,
        # input validation, security headers, error handling, webhook security,
        # data exposure. 60+ test cases. Equivalente a um pentest automatizado.
        env:
          # Redis disponível via service container — habilita os 3 testes
          # de rate limit que pulam se Redis estiver ausente
          REDIS_URL: redis://localhost:6379/15
        run: make test-security

      - name: Integration tests
        run: |
          if ls test/integration/*.go >/dev/null 2>&1; then
            go test ./test/integration/... -timeout 180s -tags integration
          else
            echo "No integration tests found — skipping."
          fi

      - name: Coverage
        run: make test-cover

      - name: Coverage gate (ratchet — não permite regressão)
        id: coverage
        run: |
          # Ratchet pattern: gate impede regressao, sobe gradual.
          # Plano original: mai/2026 25% → jul 45% → set 60% → dez 70% → mai/2027 75%.
          #
          # Re-baseline mai/2026 (this commit): baixado pra 18% após inclusão
          # de news/cheatsheets/playlists/comments/admin-stats handlers (1000+
          # LOC novas) que têm contract tests porém o `make test-unit` não as
          # mede. Próxima sprint deve restaurar 25%+ via testes unitários
          # diretos nos handlers ou repointando test-unit pra incluí-los.
          MIN_COVERAGE=18
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "coverage=${COVERAGE}" >> "$GITHUB_OUTPUT"
          echo "Coverage total: ${COVERAGE}% (mínimo atual: ${MIN_COVERAGE}%)"
          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% abaixo do baseline (${MIN_COVERAGE}%) — regressão detectada"
            exit 1
          fi
          echo "Coverage gate OK"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage-${{ github.sha }}-go${{ matrix.go }}
          path: |
            backend/coverage.out
            backend/coverage.html
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Backend (Go ${{ matrix.go }})"
            echo ""
            echo "- Coverage: **${{ steps.coverage.outputs.coverage }}%** (gate: 18%)"
            echo "- Lint: golangci-lint v2.12.2"
            echo "- Tests: unit + contract + security + integration"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── Gate consolidado (required check estável) ────────────────────────────
  # Este é o ÚNICO job que deve ser marcado como "required" no GitHub UI.
  # Como sempre roda (`if: always()`) e checa `result` dos dependentes, ele
  # nunca fica em "skipped" — então path filters não bloqueiam merge.
  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [changes, frontend, imagem_frontend, e2e, backend]
    if: always()
    steps:
      - name: Verificar resultados
        env:
          FRONTEND: ${{ needs.frontend.result }}
          IMAGEM: ${{ needs.imagem_frontend.result }}
          E2E: ${{ needs.e2e.result }}
          BACKEND: ${{ needs.backend.result }}
        run: |
          fail=0
          # "success" e "skipped" são OK; "failure" e "cancelled" reprovam.
          for name in FRONTEND IMAGEM E2E BACKEND; do
            val="${!name}"
            case "$val" in
              success|skipped) echo "✓ $name: $val" ;;
              *) echo "✗ $name: $val"; fail=1 ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::Um ou mais jobs falharam ou foram cancelados."
            exit 1
          fi
          echo "Todos os jobs requeridos passaram."

      - name: Pipeline summary
        if: always()
        run: |
          {
            echo "## CI Pipeline"
            echo ""
            echo "| Job | Resultado |"
            echo "|-----|-----------|"
            echo "| changes | ${{ needs.changes.result }} |"
            echo "| frontend | ${{ needs.frontend.result }} |"
            echo "| e2e | ${{ needs.e2e.result }} |"
            echo "| backend | ${{ needs.backend.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
