name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Nunca cancela um deploy em andamento — um deploy pela metade é pior que nenhum.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── Guard ─────────────────────────────────────────────────────────────────
  # Só prossegue se o CI passou (push automático) ou se foi disparo manual.
  # Requer vars.DEPLOY_ENABLED == 'true' (Repository Variable, não secret).
  # Enquanto a infra não estiver configurada, deixar como 'false' ou não setar.
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      commit_sha: ${{ steps.gate.outputs.commit_sha }}
    steps:
      - id: gate
        run: |
          if [[ "${{ vars.DEPLOY_ENABLED }}" != "true" ]]; then
            echo "DEPLOY_ENABLED != true — deploy ignorado (infraestrutura ainda não configurada)."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          EVENT="${{ github.event_name }}"
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"

          echo "Evento: $EVENT"
          echo "Conclusão do CI upstream: ${CONCLUSION:-N/A}"
          echo "Head SHA do CI upstream:  ${HEAD_SHA:-N/A}"

          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo "Disparo manual — bypassa gate de CI."
            echo "should_run=true"  >> "$GITHUB_OUTPUT"
            echo "commit_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          elif [[ "$CONCLUSION" == "success" ]]; then
            echo "CI passou — prosseguindo deploy."
            echo "should_run=true"  >> "$GITHUB_OUTPUT"
            echo "commit_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::error::CI conclusion='$CONCLUSION' — deploy abortado. Veja qual job falhou em Actions → CI."
          fi

  # ─── Build & Push imagem Docker → GHCR ────────────────────────────────────
  build-push:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    permissions:
      contents: read
      packages: write
      security-events: write
      # actions: read — necessário no upload-sarif quando o workflow é
      # triggered por workflow_run. Sem isso, upload falha em "Resource not
      # accessible by integration" porque a action tenta correlacionar o
      # SARIF com o run upstream via /rest/actions/workflow-runs.
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.commit_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags e labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ffv-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build e push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/deployments/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache de layers no GitHub Actions (grátis, reduz ~60% do build time)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      # ─── Trivy: scan da imagem final por CVEs ────────────────────────────
      # Falha o deploy se houver CRITICAL não-fixado. HIGH é apenas warning.
      # Sai grátis (Trivy é open source) e roda em ~30s para imagens pequenas.
      - name: Trivy image scan (CRITICAL bloqueia)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/ffv-api:${{ steps.meta.outputs.version }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'
          vuln-type: 'os,library'

      - name: Trivy image scan (HIGH apenas warning, upload SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/ffv-api:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      # Upload SARIF para o GitHub Security tab é OPCIONAL — só funciona se
      # "Code scanning" estiver habilitado nas Settings do repo. Em repos
      # privados isso exige GitHub Advanced Security (pago). O Trivy CRITICAL
      # acima JÁ BLOQUEIA o deploy — esse upload é apenas para visualização
      # no Security tab. Por isso continue-on-error: true.
      - name: Upload Trivy SARIF (opcional — requer Code Scanning ativo)
        if: always() && hashFiles('trivy-image.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-image.sarif'
          category: trivy-image
          sha: ${{ github.event.workflow_run.head_sha || github.sha }}
          ref: ${{ github.event.workflow_run.head_branch && format('refs/heads/{0}', github.event.workflow_run.head_branch) || github.ref }}

  # ─── Deploy: Backend na VPS ────────────────────────────────────────────────
  deploy-backend:
    needs: [check, build-push]
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.commit_sha }}

      - name: Copiar arquivos de deploy para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # Copia para /tmp/ffv-deploy/ mantendo a estrutura de pastas do repo
          source: "backend/deployments/docker-compose.prod.yml,backend/deployments/nginx,backend/migrations,scripts/deploy.sh"
          target: "/tmp/ffv-deploy/"

      - name: Rodar deploy na VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG,GHCR_TOKEN,REPO_OWNER
          command_timeout: 10m
          script: |
            set -euo pipefail

            # Mover arquivos sincronizados para os locais corretos
            cp  -f  /tmp/ffv-deploy/backend/deployments/docker-compose.prod.yml /opt/ffv/docker-compose.prod.yml
            cp  -rf /tmp/ffv-deploy/backend/deployments/nginx/.                  /opt/ffv/nginx/
            cp  -rf /tmp/ffv-deploy/backend/migrations/.                         /opt/ffv/migrations/
            cp  -f  /tmp/ffv-deploy/scripts/deploy.sh                            /opt/ffv/bin/deploy.sh
            chmod +x /opt/ffv/bin/deploy.sh
            rm  -rf /tmp/ffv-deploy

            # Executar o script de deploy (recebe IMAGE_TAG, GHCR_TOKEN, REPO_OWNER via env)
            /opt/ffv/bin/deploy.sh

  # ─── Smoke tests pós-deploy ────────────────────────────────────────────────
  # Valida que a API está respondendo e os endpoints críticos retornam 200.
  # Se falhar, o deploy é considerado quebrado (mesmo que o container subiu).
  smoke-test-backend:
    needs: [check, deploy-backend]
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Aguardar DNS/Nginx warm-up
        run: sleep 15

      - name: Health check
        run: |
          set -e
          for i in 1 2 3 4 5; do
            if curl -fsSL https://api.fernandofrancovalle.com/healthz; then
              echo "✓ /healthz OK"
              exit 0
            fi
            echo "Tentativa $i/5 falhou, aguardando 10s..."
            sleep 10
          done
          echo "::error::Health check falhou após 5 tentativas"
          exit 1

      - name: Readiness check
        run: |
          curl -fsSL https://api.fernandofrancovalle.com/readyz
          echo "✓ /readyz OK"

      - name: Features endpoint
        run: |
          response=$(curl -fsSL https://api.fernandofrancovalle.com/api/v1/features)
          echo "Response: $response"
          echo "$response" | grep -q "billing_enabled" || { echo "::error::Resposta inválida"; exit 1; }
          echo "✓ /api/v1/features OK"

      - name: Public stats endpoint
        run: |
          curl -fsSL https://api.fernandofrancovalle.com/api/v1/stats
          echo "✓ /api/v1/stats OK"

  # ─── Deploy: Frontend na Hostinger (FTP) ───────────────────────────────────
  deploy-frontend:
    needs: [check, build-push]
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.commit_sha }}

      - name: Setup Node + caches
        uses: ./.github/actions/setup-node
        with:
          working-directory: frontend

      - name: Build export estático com URL da API de produção
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: npm run build

      - name: Upload para Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./frontend/out/
          server-dir: ${{ secrets.HOSTINGER_FTP_DIR }}
          # Sync incremental: só envia arquivos que mudaram (compara hash).
          # public_html/ foi limpo manualmente em 2026-05-13 — daqui em diante
          # o state file é criado do zero e mantém os deploys rápidos.
          #
          # state-name versionado: trocar o nome força o action a tratar como
          # primeiro deploy (sem tentar deletar arquivos do state antigo).
          # Bump quando a árvore de arquivos no servidor divergir do state —
          # foi o caso após clean-slate manual + delete dos 765 page.tsx em
          # 33e4c09. Erro 550 "No such file or directory" indica state
          # apontando pra pastas que já não existem no FTP.
          state-name: .ftp-deploy-state-v2-2026-05-14.json
          log-level: standard
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/Thumbs.db
            # ─── RSC payloads (ADR-0002) ──────────────────────────────────────
            # Next.js gera 6.287 arquivos __next.*.txt (153 MB, 76% do build).
            # Hostinger Cloud Startup tem timeout fixo de 3600s no FTP server,
            # impossível de upar 8k arquivos. Excluindo, deploy cai de 1h+ para
            # ~15 min. SEO/funcionalidade 100% preservados (HTML completo está
            # em *.html); só degrada soft-navigation client-side entre rotas
            # (~80ms → ~400ms por clique em <Link>).
            # Decisão temporária até migração para SSR/ISR na VPS — ver
            # frontend/docs/adr/0002-exclude-rsc-payloads-from-ftp-deploy.md
            **/__next.*.txt

      # ─── Smoke test: TODAS as páginas devem responder 200 ─────────────────
      # Falha o deploy se qualquer página retornar erro. Previne incidentes
      # onde arquivos sobem mas o servidor não consegue servi-los (ex: 403
      # por trailingSlash inconsistente, FTP que pulou arquivos, cache stale).
      #
      # Roda em modo "sample" (200 rotas amostradas aleatoriamente) pra ser
      # rápido — testar todas as 915 levaria minutos. Pra validação completa,
      # rodar localmente: bash scripts/smoke-test-frontend.sh
      - name: Smoke test (200 rotas amostradas)
        working-directory: ${{ github.workspace }}
        env:
          BASE_URL: https://fernandofrancovalle.com
          OUT_DIR: frontend/out
          SAMPLE_SIZE: '200'
          PARALLEL: '15'
          TIMEOUT_SECONDS: '15'
        run: bash scripts/smoke-test-frontend.sh

  # ─── Notificação pós-deploy (Discord/Slack) ───────────────────────────────
  # Roda mesmo se algum job anterior falhou — assim o usuário sabe se deu errado.
  # Se DEPLOY_NOTIFY_WEBHOOK_URL não estiver setada, só loga e termina OK.
  notify:
    needs: [check, build-push, deploy-backend, smoke-test-backend, deploy-frontend]
    if: always() && needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Calcular status agregado
        id: status
        env:
          BUILD: ${{ needs.build-push.result }}
          BACK: ${{ needs.deploy-backend.result }}
          SMOKE: ${{ needs.smoke-test-backend.result }}
          FRONT: ${{ needs.deploy-frontend.result }}
        run: |
          if [[ "$BUILD" == "success" && "$BACK" == "success" && "$SMOKE" == "success" && "$FRONT" == "success" ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "emoji=:white_check_mark:" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "emoji=:x:" >> "$GITHUB_OUTPUT"
          fi

      - name: Enviar webhook (se configurado)
        env:
          WEBHOOK: ${{ secrets.DEPLOY_NOTIFY_WEBHOOK_URL }}
          STATUS: ${{ steps.status.outputs.status }}
          EMOJI: ${{ steps.status.outputs.emoji }}
          SHA: ${{ needs.check.outputs.commit_sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "${WEBHOOK}" ]]; then
            echo "DEPLOY_NOTIFY_WEBHOOK_URL não configurado — pulando notificação."
            exit 0
          fi
          # Payload genérico compatível com Discord e Slack via content/text.
          payload=$(jq -n \
            --arg msg "${EMOJI} Deploy **${STATUS}** | sha=\`${SHA:0:7}\` | autor=${ACTOR} | <${RUN_URL}|ver run>" \
            '{content: $msg, text: $msg}')
          curl -fsSL -X POST -H "Content-Type: application/json" -d "${payload}" "${WEBHOOK}" \
            || echo "::warning::Falha ao enviar webhook (não falha o deploy)"

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "## Deploy"
            echo ""
            echo "- Status: ${{ steps.status.outputs.status }}"
            echo "- Commit: \`${{ needs.check.outputs.commit_sha }}\`"
            echo "- Image: \`${{ needs.build-push.outputs.image_tag }}\`"
            echo ""
            echo "| Job | Resultado |"
            echo "|-----|-----------|"
            echo "| build-push | ${{ needs.build-push.result }} |"
            echo "| deploy-backend | ${{ needs.deploy-backend.result }} |"
            echo "| smoke-test-backend | ${{ needs.smoke-test-backend.result }} |"
            echo "| deploy-frontend | ${{ needs.deploy-frontend.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
