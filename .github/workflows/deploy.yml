name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Nunca cancela um deploy em andamento — um deploy pela metade é pior que nenhum.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── Guard ─────────────────────────────────────────────────────────────────
  # Só prossegue se o CI passou (push automático) ou se foi disparo manual.
  # Requer vars.DEPLOY_ENABLED == 'true' (Repository Variable, não secret).
  # Enquanto a infra não estiver configurada, deixar como 'false' ou não setar.
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      commit_sha: ${{ steps.gate.outputs.commit_sha }}
    steps:
      - id: gate
        run: |
          if [[ "${{ vars.DEPLOY_ENABLED }}" != "true" ]]; then
            echo "DEPLOY_ENABLED != true — deploy ignorado (infraestrutura ainda não configurada)."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          EVENT="${{ github.event_name }}"
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"

          echo "Evento: $EVENT"
          echo "Conclusão do CI upstream: ${CONCLUSION:-N/A}"
          echo "Head SHA do CI upstream:  ${HEAD_SHA:-N/A}"

          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo "Disparo manual — bypassa gate de CI."
            echo "should_run=true"  >> "$GITHUB_OUTPUT"
            echo "commit_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          elif [[ "$CONCLUSION" == "success" ]]; then
            echo "CI passou — prosseguindo deploy."
            echo "should_run=true"  >> "$GITHUB_OUTPUT"
            echo "commit_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::error::CI conclusion='$CONCLUSION' — deploy abortado. Veja qual job falhou em Actions → CI."
          fi

  # ─── Build & Push imagem Docker → GHCR ────────────────────────────────────
  build-push:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    permissions:
      contents: read
      packages: write
      security-events: write
      # actions: read — necessário no upload-sarif quando o workflow é
      # triggered por workflow_run. Sem isso, upload falha em "Resource not
      # accessible by integration" porque a action tenta correlacionar o
      # SARIF com o run upstream via /rest/actions/workflow-runs.
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.commit_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags e labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ffv-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build e push
        id: build
        uses: docker/build-push-action@v6
        with:
          # Context = raiz do monorepo, porque a imagem precisa de:
          #   - backend/ (source Go)
          #   - scripts/seeds/ (hubs/trails + 767 articles JSON bundlados na imagem)
          context: .
          file: ./backend/deployments/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache de layers no GitHub Actions (grátis, reduz ~60% do build time)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      # ─── Trivy: scan da imagem final por CVEs ────────────────────────────
      # Falha o deploy se houver CRITICAL não-fixado. HIGH é apenas warning.
      # Sai grátis (Trivy é open source) e roda em ~30s para imagens pequenas.
      - name: Trivy image scan (CRITICAL bloqueia)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/ffv-api:${{ steps.meta.outputs.version }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'
          vuln-type: 'os,library'

      - name: Trivy image scan (HIGH apenas warning, upload SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/ffv-api:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      # Upload SARIF para o GitHub Security tab é OPCIONAL — só funciona se
      # "Code scanning" estiver habilitado nas Settings do repo. Em repos
      # privados isso exige GitHub Advanced Security (pago). O Trivy CRITICAL
      # acima JÁ BLOQUEIA o deploy — esse upload é apenas para visualização
      # no Security tab. Por isso continue-on-error: true.
      - name: Upload Trivy SARIF (opcional — requer Code Scanning ativo)
        if: always() && hashFiles('trivy-image.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-image.sarif'
          category: trivy-image
          sha: ${{ github.event.workflow_run.head_sha || github.sha }}
          ref: ${{ github.event.workflow_run.head_branch && format('refs/heads/{0}', github.event.workflow_run.head_branch) || github.ref }}

  # ─── Build & Push imagem Docker frontend → GHCR ───────────────────────────
  build-push-frontend:
    name: Build & Push frontend Docker image
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      frontend_tag: ${{ steps.meta.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.commit_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags e labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ffv-frontend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build e push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ─── Deploy: Backend na VPS ────────────────────────────────────────────────
  deploy-backend:
    needs: [check, build-push, build-push-frontend]
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.commit_sha }}

      - name: Copiar arquivos de deploy para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # Copia para /tmp/ffv-deploy/ mantendo a estrutura de pastas do repo
          source: "backend/deployments/docker-compose.prod.yml,backend/deployments/nginx,backend/migrations,scripts/deploy.sh"
          target: "/tmp/ffv-deploy/"

      - name: Rodar deploy na VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
          FRONTEND_TAG: ${{ needs.build-push-frontend.outputs.frontend_tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG,FRONTEND_TAG,GHCR_TOKEN,REPO_OWNER
          command_timeout: 10m
          script: |
            set -euo pipefail

            # Mover arquivos sincronizados para os locais corretos
            cp  -f  /tmp/ffv-deploy/backend/deployments/docker-compose.prod.yml /opt/ffv/docker-compose.prod.yml
            cp  -rf /tmp/ffv-deploy/backend/deployments/nginx/.                  /opt/ffv/nginx/
            cp  -rf /tmp/ffv-deploy/backend/migrations/.                         /opt/ffv/migrations/
            cp  -f  /tmp/ffv-deploy/scripts/deploy.sh                            /opt/ffv/bin/deploy.sh
            chmod +x /opt/ffv/bin/deploy.sh
            rm  -rf /tmp/ffv-deploy

            # Executar o script de deploy (recebe IMAGE_TAG, FRONTEND_TAG, GHCR_TOKEN, REPO_OWNER via env)
            /opt/ffv/bin/deploy.sh

  # ─── Smoke tests pós-deploy ────────────────────────────────────────────────
  # Valida que a API está respondendo e os endpoints críticos retornam 200.
  # Se falhar, o deploy é considerado quebrado (mesmo que o container subiu).
  smoke-test-backend:
    needs: [check, deploy-backend]
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Aguardar DNS/Nginx warm-up
        run: sleep 15

      - name: Health check
        run: |
          set -e
          for i in 1 2 3 4 5; do
            if curl -fsSL https://api.fernandofrancovalle.com/healthz; then
              echo "✓ /healthz OK"
              exit 0
            fi
            echo "Tentativa $i/5 falhou, aguardando 10s..."
            sleep 10
          done
          echo "::error::Health check falhou após 5 tentativas"
          exit 1

      - name: Readiness check
        run: |
          curl -fsSL https://api.fernandofrancovalle.com/readyz
          echo "✓ /readyz OK"

      - name: Features endpoint
        run: |
          response=$(curl -fsSL https://api.fernandofrancovalle.com/api/v1/features)
          echo "Response: $response"
          echo "$response" | grep -q "billing_enabled" || { echo "::error::Resposta inválida"; exit 1; }
          echo "✓ /api/v1/features OK"

      - name: Public stats endpoint
        run: |
          curl -fsSL https://api.fernandofrancovalle.com/api/v1/stats
          echo "✓ /api/v1/stats OK"

      # Garantia pós-deploy: o curriculum foi seedado e está acessível.
      # Catches o bug que estava em prod onde /aprenda/<slug> dava 404 porque
      # curriculum_articles tinha 0 rows (importer nunca rodou).
      - name: Curriculum populated
        run: |
          set -e
          response=$(curl -fsSL "https://api.fernandofrancovalle.com/api/v1/curriculum?limit=1&offset=0")
          echo "Response (truncado): $(echo $response | head -c 200)..."
          total=$(echo "$response" | python3 -c "import json, sys; print(json.load(sys.stdin).get('total', 0))")
          echo "Curriculum tem $total artigos publicados"
          if [ "$total" -lt 700 ]; then
            echo "::error::Curriculum tem apenas $total artigos — esperado ≥ 700. /aprenda/* vai dar 404."
            exit 1
          fi
          echo "✓ Curriculum populado (≥ 700 artigos)"

      # Smoke real do user-facing: fetcha o slug que estava bugado em prod.
      - name: Critical slug resolves (o-que-e-cloud)
        run: |
          set -e
          status=$(curl -s -o /tmp/article.json -w "%{http_code}" \
            "https://api.fernandofrancovalle.com/api/v1/curriculum/o-que-e-cloud")
          if [ "$status" != "200" ]; then
            echo "::error::Slug crítico o-que-e-cloud retornou $status (esperado 200)"
            cat /tmp/article.json
            exit 1
          fi
          # Article deve ter title e blocks no body.
          python3 -c "
          import json
          with open('/tmp/article.json') as f: d = json.load(f)
          assert d.get('title'), 'article sem title'
          assert isinstance(d.get('blocks', []), list), 'blocks ausente ou tipo errado'
          print(f'✓ o-que-e-cloud OK — title={d[\"title\"][:60]!r}, {len(d.get(\"blocks\", []))} blocks')
          "

  # ─── Notificação pós-deploy (Discord/Slack) ───────────────────────────────
  # Roda mesmo se algum job anterior falhou — assim o usuário sabe se deu errado.
  # Se DEPLOY_NOTIFY_WEBHOOK_URL não estiver setada, só loga e termina OK.
  notify:
    needs: [check, build-push, build-push-frontend, deploy-backend, smoke-test-backend]
    if: always() && needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Calcular status agregado
        id: status
        env:
          BUILD: ${{ needs.build-push.result }}
          BUILD_FRONT: ${{ needs.build-push-frontend.result }}
          BACK: ${{ needs.deploy-backend.result }}
          SMOKE: ${{ needs.smoke-test-backend.result }}
        run: |
          if [[ "$BUILD" == "success" && "$BUILD_FRONT" == "success" && "$BACK" == "success" && "$SMOKE" == "success" ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "emoji=:white_check_mark:" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "emoji=:x:" >> "$GITHUB_OUTPUT"
          fi

      - name: Enviar webhook (se configurado)
        env:
          WEBHOOK: ${{ secrets.DEPLOY_NOTIFY_WEBHOOK_URL }}
          STATUS: ${{ steps.status.outputs.status }}
          EMOJI: ${{ steps.status.outputs.emoji }}
          SHA: ${{ needs.check.outputs.commit_sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "${WEBHOOK}" ]]; then
            echo "DEPLOY_NOTIFY_WEBHOOK_URL não configurado — pulando notificação."
            exit 0
          fi
          # Payload genérico compatível com Discord e Slack via content/text.
          payload=$(jq -n \
            --arg msg "${EMOJI} Deploy **${STATUS}** | sha=\`${SHA:0:7}\` | autor=${ACTOR} | <${RUN_URL}|ver run>" \
            '{content: $msg, text: $msg}')
          curl -fsSL -X POST -H "Content-Type: application/json" -d "${payload}" "${WEBHOOK}" \
            || echo "::warning::Falha ao enviar webhook (não falha o deploy)"

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "## Deploy"
            echo ""
            echo "- Status: ${{ steps.status.outputs.status }}"
            echo "- Commit: \`${{ needs.check.outputs.commit_sha }}\`"
            echo "- Image backend: \`${{ needs.build-push.outputs.image_tag }}\`"
            echo "- Image frontend: \`${{ needs.build-push-frontend.outputs.frontend_tag }}\`"
            echo ""
            echo "| Job | Resultado |"
            echo "|-----|-----------|"
            echo "| build-push | ${{ needs.build-push.result }} |"
            echo "| build-push-frontend | ${{ needs.build-push-frontend.result }} |"
            echo "| deploy-backend | ${{ needs.deploy-backend.result }} |"
            echo "| smoke-test-backend | ${{ needs.smoke-test-backend.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
