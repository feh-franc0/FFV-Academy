name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Toda segunda-feira às 04:00 UTC — pega CVEs novos mesmo sem commits.
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ─── gosec + govulncheck (backend) ────────────────────────────────────────
  backend-security:
    name: Backend security scans
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go + caches
        uses: ./.github/actions/setup-go
        with:
          working-directory: backend
          cache-key-suffix: security

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec (SARIF)
        continue-on-error: true
        # G402: TLS MinVersion (falso positivo — Go default já é seguro)
        # G401,G501: MD5/SHA1 (não usados diretamente)
        # G107: URL de variável (pgxpool, net/http — false positive em servidores)
        # G110: decompression bomb (não aplicável)
        run: gosec -fmt sarif -out gosec.sarif -exclude=G401,G402,G501,G107,G110 ./...

      - name: Upload gosec SARIF
        # Code Scanning em repos privados exige GitHub Advanced Security (pago).
        # continue-on-error garante que repos sem GAS não bloqueiem o workflow.
        if: always() && hashFiles('backend/gosec.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/gosec.sarif
          category: gosec

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        # CVEs em deps transitivas não-chamadas não bloqueiam — apenas aviso.
        run: govulncheck ./... || echo "::warning::govulncheck encontrou vulnerabilidades — revisar go.mod"

  # ─── npm audit (frontend) ─────────────────────────────────────────────────
  frontend-security:
    name: Frontend security scans
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node + caches
        uses: ./.github/actions/setup-node
        with:
          working-directory: frontend

      - name: npm audit (high+)
        continue-on-error: true
        run: npm audit --audit-level=high

  # ─── Gitleaks: detecta secrets commitados acidentalmente ──────────────────
  # Free tier para repos públicos. Para repos privados, requer GITLEAKS_LICENSE.
  gitleaks:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # ativar se repo virar privado

  # ─── OSV-Scanner: vulnerabilidades em Go + npm em um único scan ───────────
  # Complementa govulncheck/npm audit usando a base de dados OSV (Google).
  # fail-on-vuln: false — não bloqueia CI; os resultados são informativos.
  osv-scanner:
    name: OSV-Scanner
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v1.9.2
    with:
      scan-args: |-
        --recursive
        --skip-git
        ./
      # Não falha o workflow se encontrar vulnerabilidades — apenas reporta.
      fail-on-vuln: false

  # ─── CodeQL: SAST para Go e JavaScript/TypeScript ─────────────────────────
  # Requer GitHub Advanced Security (pago para repos privados).
  # continue-on-error nos steps de upload para não bloquear repos sem GAS.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v3

      - name: Perform analysis
        continue-on-error: true
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
