name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-checks-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ─── Labeler automático por paths ─────────────────────────────────────────
  # Lê .github/labeler.yml e aplica labels (frontend/backend/infra/docs) ao PR.
  labeler:
    name: Auto-label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true

  # ─── Coverage diff comment ────────────────────────────────────────────────
  # Compara coverage do PR com main e posta comentário sticky no PR.
  # Roda só se houve mudança em backend (economiza minutos).
  coverage-diff:
    name: Backend coverage diff
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ffv
          POSTGRES_PASSWORD: ffv
          POSTGRES_DB: ffv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ffv -d ffv_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ffv:ffv@localhost:5432/ffv_test?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'

      - name: Setup Go + caches
        if: steps.filter.outputs.backend == 'true'
        uses: ./.github/actions/setup-go
        with:
          working-directory: backend
          cache-key-suffix: pr-coverage

      - name: Install migrate
        if: steps.filter.outputs.backend == 'true'
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/migrate

      - name: Run migrations
        if: steps.filter.outputs.backend == 'true'
        working-directory: backend
        run: make migrate

      - name: Coverage on PR HEAD
        if: steps.filter.outputs.backend == 'true'
        working-directory: backend
        run: |
          make test-cover
          PR_COV=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "PR_COV=$PR_COV" >> "$GITHUB_ENV"

      - name: Coverage on main
        if: steps.filter.outputs.backend == 'true'
        working-directory: backend
        run: |
          git fetch origin main --depth=1
          git stash --include-untracked || true
          git checkout origin/main -- .
          # Migrations já rodaram; só rodamos cover.
          make test-cover || echo "main cover failed — comparando como 0"
          BASE_COV=$(go tool cover -func=coverage.out 2>/dev/null | grep total | awk '{print $3}' | sed 's/%//' || echo "0")
          echo "BASE_COV=$BASE_COV" >> "$GITHUB_ENV"

      - name: Post sticky comment
        if: steps.filter.outputs.backend == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-diff
          message: |
            ### Backend coverage

            | | Coverage |
            |--|--|
            | `main` (base) | **${{ env.BASE_COV }}%** |
            | this PR | **${{ env.PR_COV }}%** |

            > Gate atual: 18% (ratchet — re-baseline mai/2026 após CMS expansion). Próxima sprint: restaurar 25%+.

  # ─── Bundle size check (apenas se frontend mudou) ─────────────────────────
  # Reusa o `bundlesize:check` já configurado em frontend/package.json. Não posta
  # diff (size-limit-action exige config dedicada), mas falha gracioso e loga.
  bundle-size:
    name: Frontend bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'

      - name: Setup Node + caches
        if: steps.filter.outputs.frontend == 'true'
        uses: ./.github/actions/setup-node
        with:
          working-directory: frontend

      - name: Build
        if: steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run build

      - name: Bundle size check
        if: steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run bundlesize:check
