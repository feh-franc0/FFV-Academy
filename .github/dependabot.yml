version: 2
# Reviewers propositalmente omitidos: este repo é single-maintainer (@feh-franc0).
# Se no futuro houver time dedicado, adicionar `reviewers:` em cada bloco.

updates:
  # ─── Backend (Go) ────────────────────────────────────────────────────────────
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
      - go
    commit-message:
      prefix: "chore(backend)"
      include: scope

  # ─── Frontend (npm) ──────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
      - javascript
    commit-message:
      prefix: "chore(frontend)"
      include: scope

  # ─── Video pipeline (npm) ────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /video-pipeline
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - video-pipeline
    commit-message:
      prefix: "chore(video)"
      include: scope

  # ─── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: UTC
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"

  # ─── Docker (backend deployment) ─────────────────────────────────────────────
  - package-ecosystem: docker
    directory: /backend/deployments
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: UTC
    labels:
      - dependencies
      - docker
      - backend
    commit-message:
      prefix: "chore(docker)"
