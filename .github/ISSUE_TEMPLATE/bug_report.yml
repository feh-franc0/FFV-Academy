name: Bug report
description: Algo está quebrado ou se comportando errado.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu?
      description: Comportamento atual + comportamento esperado.
      placeholder: "Cliquei em X, esperava Y, vi Z."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Vá para /...
        2. Clique em ...
        3. Veja erro
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Área afetada
      options:
        - frontend (Next.js)
        - backend (Go API)
        - mcp
        - video-pipeline
        - infra/CI
        - outro
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Ambiente
      placeholder: "Chrome 140 / macOS 26.4 / produção"

  - type: textarea
    id: logs
    attributes:
      label: Logs / stacktrace
      render: shell
