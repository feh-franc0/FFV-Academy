name: Feature request
description: Sugestão de nova funcionalidade ou melhoria.
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Que problema isso resolve?
      description: "Comece pelo problema, não pela solução. \"Usuário X não consegue Y porque Z.\""
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Como você imagina a solução? Quanto mais concreto, melhor.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: O que você descartou e por quê?

  - type: dropdown
    id: tier
    attributes:
      label: Tier estimado (ver CLAUDE.md > Roadmap)
      options:
        - Tier 1 (alto impacto, baixo esforço)
        - Tier 2 (alto impacto, médio esforço)
        - Tier 3 (estratégico, alto esforço)
        - Não sei
