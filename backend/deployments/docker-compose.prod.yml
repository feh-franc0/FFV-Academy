name: ffv-prod

services:
  # ─── Nginx: proxy reverso + SSL + load balancer ─────────────────────────────
  nginx:
    # Pinada por digest (achado P-12) — Dependabot mantém atualizado.
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/ffv/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/ffv/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    networks:
      - proxy
    depends_on:
      api:
        condition: service_healthy

  # ─── Go API (2 réplicas via --scale api=2 no deploy.sh) ─────────────────────
  # O Docker DNS resolve "api" para todas as réplicas saudáveis.
  # O Nginx upstream detecta falhas via max_fails e exclui a réplica doente.
  # Enquanto Docker reinicia a réplica com problema, 100% do tráfego vai para a outra.
  api:
    image: ghcr.io/feh-franc0/ffv-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: /opt/ffv/.env
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api", "--healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      resources:
        limits:
          memory: 512m
          cpus: "0.8"
        reservations:
          memory: 128m
          cpus: "0.1"
    networks:
      - proxy
      - data

  # ─── Frontend Next.js (SSR standalone) ─────────────────────────────────────
  frontend:
    image: ghcr.io/feh-franc0/ffv-frontend:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://api.fernandofrancovalle.com
    expose:
      - "3000"
    healthcheck:
      # O Next standalone escuta no IP da interface do container, não em
      # localhost. A sonda usa esse IP para refletir o caminho que a rede Docker
      # realmente usa e evitar um falso estado `unhealthy`.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://$(hostname -i):3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.8"
    networks:
      - proxy

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    # Pinada por digest (achado P-12) — Dependabot mantém atualizado.
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_USER: ffv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ffv_prod
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ffv -d ffv_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.8"
        reservations:
          memory: 256m
          cpus: "0.1"
    networks:
      - data

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    # Pinada por digest (achado P-12) — Dependabot mantém atualizado.
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 320m
          cpus: "0.3"
        reservations:
          memory: 64m
          cpus: "0.05"
    networks:
      - data

volumes:
  postgres_data:
  redis_data:
  certbot_webroot:

networks:
  proxy:
  data:
    internal: true
