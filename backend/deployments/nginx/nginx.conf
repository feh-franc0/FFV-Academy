user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Não expõe versão do nginx em respostas de erro
    server_tokens off;

    # Compressão para respostas JSON e texto
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # Rate limiting: burst permite picos curtos, depois aplica o limite
    limit_req_zone $binary_remote_addr zone=api_geral:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api_auth:10m  rate=5r/m;

    # Retorna 429 (Too Many Requests) em vez de 503 no rate limit
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
