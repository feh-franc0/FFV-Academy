user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Não expõe versão do nginx em respostas de erro
    server_tokens off;

    # Compressão para respostas JSON e texto
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # ─── Rate limiting profissional ─────────────────────────────────────────
    # Filosofia: TRÊS camadas distintas, calibradas para usuários reais
    # (estudantes navegando, lendo, voltando) sem barrar uso normal.
    #
    # 1) fe_browse — frontend SSR (HTML, RSC payloads, prefetch do Next).
    #    Next.js faz prefetch agressivo no hover; uma página com 20 links
    #    pode disparar 20 GETs em segundos. 600r/m = 10 req/s sustentável.
    limit_req_zone $binary_remote_addr zone=fe_browse:10m rate=600r/m;

    # 2) api_general — API autenticada (fetch de dados, mutações UX).
    #    Cliente típico faz GET /me, /preferences, /progress, /stats em
    #    paralelo no boot. 300r/m = 5 req/s sustentável.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=300r/m;

    # 3) api_auth — endpoints sensíveis (login, magic link, refresh).
    #    Brute-force protection: 10 tentativas/min é razoável para humano,
    #    inviável para atacante automatizado.
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;

    # 4) ddos_per_path — defesa específica anti-DDoS por endpoint.
    #    Chave = IP + URI: pega "mesmo cliente martelando mesma URL".
    #    Usuário real visita /aprenda/x uma vez; bot visita 1000x.
    #    50r/m por (IP, URL) é altíssimo pra humano e mínimo pra ataque.
    limit_req_zone $binary_remote_addr$uri zone=ddos_per_path:20m rate=50r/m;

    # Retorna 429 (Too Many Requests) em vez de 503 no rate limit
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
