user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Não expõe versão do nginx em respostas de erro
    server_tokens off;

    # Compressão para respostas JSON e texto
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # ─── Rate limiting ─────────────────────────────────────────────────────
    # Filosofia: SUPER permissivo pra navegação real; apenas /auth é tight
    # (anti brute-force). Nada de "ddos_per_path" — bloqueava F5 do dev e
    # prefetch agressivo do Next na mesma URL.
    #
    # 1) fe_browse — frontend SSR (HTML, RSC, prefetch, _next/data).
    #    1200r/m = 20 req/s sustentável + burst absorve picos.
    limit_req_zone $binary_remote_addr zone=fe_browse:10m rate=1200r/m;

    # 2) api_general — API autenticada (uso normal de cliente real).
    #    600r/m = 10 req/s sustentável. Suficiente pra todo padrão observado.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=600r/m;

    # 3) api_auth — endpoints sensíveis (login, magic link, refresh).
    #    Brute-force protection: 10 tentativas/min, humano OK, bot não.
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;

    # 4) api_webhook — webhook do Stripe (achado P-10, auditoria de
    #    11/ago/2026). A assinatura HMAC já protege a LÓGICA (evento forjado
    #    nunca é processado); este limite protege CPU — sem ele, qualquer
    #    request anônimo força o app a computar HMAC sobre até 1MB antes de
    #    rejeitar. 300r/m com burst folgado absorve rajadas legítimas do
    #    Stripe sem abrir a porta pra flood anônimo.
    limit_req_zone $binary_remote_addr zone=api_webhook:10m rate=300r/m;

    # Retorna 429 (Too Many Requests) em vez de 503 no rate limit
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
