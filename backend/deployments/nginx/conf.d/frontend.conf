upstream frontend_backend {
    server frontend:3000;
    keepalive 16;
}

# ─── HTTP: redireciona para HTTPS ──────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name fernandofrancovalle.com www.fernandofrancovalle.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://fernandofrancovalle.com$request_uri;
    }
}

# ─── HTTPS www: redireciona para apex ──────────────────────────────────────
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name www.fernandofrancovalle.com;

    ssl_certificate     /etc/letsencrypt/live/fernandofrancovalle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fernandofrancovalle.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Lista explícita (Mozilla "Intermediate", achado P-12) — mesma razão do
    # vhost principal abaixo e de api.conf.
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    return 301 https://fernandofrancovalle.com$request_uri;
}

# ─── HTTPS: proxy reverso para o Next.js standalone ────────────────────────
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name fernandofrancovalle.com;

    ssl_certificate     /etc/letsencrypt/live/fernandofrancovalle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fernandofrancovalle.com/privkey.pem;
    ssl_session_cache   shared:SSL_FE:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Lista explícita (Mozilla "Intermediate", achado P-12) em vez de
    # HIGH:!aNULL:!MD5 — mesma razão documentada em api.conf.
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # includeSubDomains adicionado (achado P-12) — preload avaliado à parte e
    # NÃO incluído (ver comentário completo em api.conf: submissão à
    # hstspreload.org é efetivamente irreversível e o domínio raiz ainda está
    # em migração DNS+SSL).
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff            always;
    add_header X-Frame-Options           SAMEORIGIN         always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;

    client_max_body_size 4m;

    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    # SOBRESCREVE, igual a api.conf (achado P-12, auditoria de 11/ago/2026):
    # $proxy_add_x_forwarded_for ANEXA ao valor que o cliente já mandou —
    # "X-Forwarded-For: 1.2.3.4" forjado chegava no Next.js como
    # "1.2.3.4, <ip real>", e o primeiro elemento (que qualquer código que
    # leia X-Forwarded-For sem tratar como lista tende a usar) é forjável.
    # Os dois vhosts precisam do MESMO tratamento — antes só api.conf
    # sobrescrevia.
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    # Next.js static assets — cache agressivo, SEM rate limit (são imutáveis
    # e o browser cacheia 1 ano; rate-limitar atrapalha sem ganho).
    location /_next/static/ {
        proxy_pass http://frontend_backend;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Health — sem rate limit
    location = /api/health {
        proxy_pass http://frontend_backend;
    }

    # Todo o resto: navegação real do Next (HTML + RSC + prefetch).
    # fe_browse: 1200r/m por IP + burst 400 nodelay. Cobre F5 repetido,
    # prefetch agressivo do Next, devtools abertas, etc.
    location / {
        limit_req zone=fe_browse burst=400 nodelay;
        proxy_pass http://frontend_backend;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
