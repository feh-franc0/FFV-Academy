upstream frontend_backend {
    server frontend:3000;
    keepalive 16;
}

# ─── HTTP: redireciona para HTTPS ──────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name fernandofrancovalle.com www.fernandofrancovalle.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://fernandofrancovalle.com$request_uri;
    }
}

# ─── HTTPS www: redireciona para apex ──────────────────────────────────────
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name www.fernandofrancovalle.com;

    ssl_certificate     /etc/letsencrypt/live/fernandofrancovalle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fernandofrancovalle.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://fernandofrancovalle.com$request_uri;
}

# ─── HTTPS: proxy reverso para o Next.js standalone ────────────────────────
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name fernandofrancovalle.com;

    ssl_certificate     /etc/letsencrypt/live/fernandofrancovalle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fernandofrancovalle.com/privkey.pem;
    ssl_session_cache   shared:SSL_FE:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options    nosniff            always;
    add_header X-Frame-Options           SAMEORIGIN         always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;

    client_max_body_size 4m;

    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    # Next.js static assets — cache agressivo, SEM rate limit (são imutáveis
    # e o browser cacheia 1 ano; rate-limitar atrapalha sem ganho).
    location /_next/static/ {
        proxy_pass http://frontend_backend;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Health — sem rate limit
    location = /api/health {
        proxy_pass http://frontend_backend;
    }

    # Todo o resto: navegação real do Next (HTML + RSC + prefetch).
    # DUAS camadas:
    #   - fe_browse: 600r/m por IP (uso normal) + burst 200 pra acomodar
    #     bursts de prefetch quando user explora menu com muitos links.
    #   - ddos_per_path: 50r/m POR (IP+URL) — só bate em ataques que
    #     martelam mesma URL repetidamente; usuário real nunca chega lá.
    location / {
        limit_req zone=fe_browse      burst=200 nodelay;
        limit_req zone=ddos_per_path  burst=100 nodelay;
        proxy_pass http://frontend_backend;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
