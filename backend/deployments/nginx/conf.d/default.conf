# Catch-all para Host não reconhecido (achado P-12, auditoria de 11/ago/2026).
#
# Sem um `default_server` explícito, o nginx usa o PRIMEIRO server block
# carregado como default — que é uma função de ORDEM DE ARQUIVO
# (`include conf.d/*.conf` carrega em ordem alfabética: api.conf antes de
# frontend.conf), não uma decisão. Um scanner batendo direto no IP com um
# Host arbitrário (ou nenhum SNI) caía silenciosamente no vhost da API.
#
# `default_server` aqui é explícito e independe de nome de arquivo — o
# parâmetro vale globalmente por (endereço:porta), não por ordem de include.
#
# HTTPS: `ssl_reject_handshake` (nginx >= 1.19.4) recusa o handshake TLS
# ainda na camada de SNI, ANTES de qualquer certificado ser necessário — não
# precisa de um certificado dummy só para este bloco.
server {
    listen      443 ssl http2 default_server;
    listen      [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}

# HTTP: fecha a conexão sem resposta (444 é uma extensão do nginx, não um
# código HTTP real) para qualquer Host que não bata com api.conf/frontend.conf.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;
    return 444;
}
