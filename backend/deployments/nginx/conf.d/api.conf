# Upstream com detecção de falha entre réplicas da API.
# Docker DNS resolve "api" para todos os containers com esse nome.
# max_fails=3: após 3 falhas em 30s, Nginx retira aquela réplica do pool.
# fail_timeout=30s: após 30s sem falhas, a réplica volta ao pool.
# proxy_next_upstream: se uma réplica retornar erro, tenta a próxima automaticamente.
# Resultado: se uma réplica travar, Nginx detecta e roteia 100% para a outra.
upstream api_backend {
    server api:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ─── HTTP: redireciona para HTTPS + ACME challenge para certbot ────────────
server {
    listen      80;
    listen      [::]:80;
    server_name api.fernandofrancovalle.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS: proxy reverso com load balance entre réplicas da API ───────────
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name api.fernandofrancovalle.com;

    ssl_certificate     /etc/letsencrypt/live/api.fernandofrancovalle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fernandofrancovalle.com/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options    nosniff            always;
    add_header X-Frame-Options           DENY               always;
    add_header Referrer-Policy           no-referrer-when-downgrade always;

    client_max_body_size 1m;

    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # Necessário para keepalive com upstream
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Se uma réplica falhar, tenta a próxima automaticamente (sem o usuário perceber)
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;

    # Health e readiness: sem rate limit
    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://api_backend;
    }

    # Stripe webhooks: sem rate limit (Stripe envia em rajadas)
    location /api/v1/webhooks/ {
        proxy_pass http://api_backend;
    }

    # Auth: rate limit restrito
    location ~ ^/api/v1/auth/ {
        limit_req zone=api_auth burst=3 nodelay;
        proxy_pass http://api_backend;
    }

    # Todos os demais endpoints
    location / {
        limit_req zone=api_geral burst=20 nodelay;
        proxy_pass http://api_backend;
    }
}
