# Upstream com detecção de falha entre réplicas da API.
# Docker DNS resolve "api" para todos os containers com esse nome.
# max_fails=3: após 3 falhas em 30s, Nginx retira aquela réplica do pool.
# fail_timeout=30s: após 30s sem falhas, a réplica volta ao pool.
# proxy_next_upstream: se uma réplica retornar erro, tenta a próxima automaticamente.
# Resultado: se uma réplica travar, Nginx detecta e roteia 100% para a outra.
upstream api_backend {
    server api:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ─── HTTP: redireciona para HTTPS + ACME challenge para certbot ────────────
server {
    listen      80;
    listen      [::]:80;
    server_name api.fernandofrancovalle.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS: proxy reverso com load balance entre réplicas da API ───────────
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name api.fernandofrancovalle.com;

    ssl_certificate     /etc/letsencrypt/live/api.fernandofrancovalle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fernandofrancovalle.com/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options    nosniff            always;
    add_header X-Frame-Options           DENY               always;
    add_header Referrer-Policy           no-referrer-when-downgrade always;

    client_max_body_size 1m;

    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # Necessário para keepalive com upstream
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Se uma réplica falhar, tenta a próxima automaticamente (sem o usuário perceber)
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;

    # Health e readiness: sem rate limit
    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://api_backend;
    }

    # Stripe webhooks: sem rate limit (Stripe envia em rajadas)
    location /api/v1/webhooks/ {
        proxy_pass http://api_backend;
    }

    # Auth: rate limit restrito (brute-force protection).
    # 10r/m por IP + burst 5 → 5 tentativas em rajada, depois 1 a cada 6s.
    location ~ ^/api/v1/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://api_backend;
    }

    # Solicitações de estudo personalizado — endpoint público multipart com
    # upload de até 10 anexos × 25 MiB = ~250 MiB. O default global de 1m
    # batia em "Failed to fetch" (connection reset pelo nginx antes do Go)
    # já em PDFs > 1 MB. Limites internos:
    #   - client_max_body_size: 250m bate com o cap do handler Go (200 MiB
    #     com folga pra boundary do multipart).
    #   - client_body_timeout: tempo máximo entre chunks do cliente —
    #     5 min cobre redes lentas (3G/4G ruim) com PDFs grandes.
    #   - proxy_read/send_timeout: tempo máximo na conversa com o upstream.
    #   - proxy_request_buffering on (default): nginx termina de receber
    #     antes de proxiar — protege o Go de clientes lentos.
    # GetStatus (GET .../status) é leve e reusa os defaults — não precisa
    # de location separada.
    location = /api/v1/study-requests {
        client_max_body_size 250m;
        client_body_timeout  5m;
        proxy_connect_timeout 5s;
        proxy_read_timeout   5m;
        proxy_send_timeout   5m;
        proxy_request_buffering on;
        limit_req zone=api_general burst=200 nodelay;
        proxy_pass http://api_backend;
    }

    # Todos os demais endpoints da API.
    # api_general: 600r/m (10 req/s sustentável) + burst 200 pra acomodar
    # paralelismo natural do cliente no boot.
    location / {
        limit_req zone=api_general burst=200 nodelay;
        proxy_pass http://api_backend;
    }
}
