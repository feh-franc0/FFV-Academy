# ─── HTTP: redireciona para HTTPS + ACME challenge para certbot ────────────
server {
    listen      80;
    listen      [::]:80;
    server_name api.fernandofrancovalle.com;

    # Certbot webroot: deixa o certbot responder para renovação de cert
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS: proxy reverso para a API Go ────────────────────────────────────
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name api.fernandofrancovalle.com;

    # Certificados Let's Encrypt (obtidos pelo certbot no host)
    ssl_certificate     /etc/letsencrypt/live/api.fernandofrancovalle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fernandofrancovalle.com/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS: força HTTPS por 6 meses (habilitar só depois de confirmar que HTTPS funciona)
    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options    nosniff            always;
    add_header X-Frame-Options           DENY               always;
    add_header Referrer-Policy           no-referrer-when-downgrade always;

    # Tamanho máximo do body (para evitar payloads gigantes)
    client_max_body_size 1m;

    # Timeouts de proxy
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # Headers que a API Go precisa para identificar o cliente real
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Health e readiness: sem rate limit (usado por monitoramento)
    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://api:8080;
    }

    # Stripe webhooks: sem rate limit (Stripe envia em rajadas)
    location /api/v1/webhooks/ {
        proxy_pass http://api:8080;
    }

    # Auth: rate limit restrito (5 req/min por IP, burst de 3)
    location ~ ^/api/v1/auth/ {
        limit_req zone=api_auth burst=3 nodelay;
        proxy_pass http://api:8080;
    }

    # Todos os demais endpoints
    location / {
        limit_req zone=api_geral burst=20 nodelay;
        proxy_pass http://api:8080;
    }
}
