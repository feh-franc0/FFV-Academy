# Upstream com detecção de falha entre réplicas da API.
# Docker DNS resolve "api" para todos os containers com esse nome.
# max_fails=3: após 3 falhas em 30s, Nginx retira aquela réplica do pool.
# fail_timeout=30s: após 30s sem falhas, a réplica volta ao pool.
# proxy_next_upstream: se uma réplica retornar erro, tenta a próxima automaticamente.
# Resultado: se uma réplica travar, Nginx detecta e roteia 100% para a outra.
upstream api_backend {
    server api:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ─── HTTP: redireciona para HTTPS + ACME challenge para certbot ────────────
server {
    listen      80;
    listen      [::]:80;
    server_name api.fernandofrancovalle.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS: proxy reverso com load balance entre réplicas da API ───────────
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name api.fernandofrancovalle.com;

    ssl_certificate     /etc/letsencrypt/live/api.fernandofrancovalle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fernandofrancovalle.com/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Lista explícita (Mozilla "Intermediate", achado P-12) em vez de
    # HIGH:!aNULL:!MD5 — a antiga inclui qualquer cifra "HIGH" reconhecida
    # pela versão do OpenSSL da imagem, então o conjunto real muda sozinho a
    # cada bump de imagem sem nenhuma mudança neste arquivo. Esta lista só
    # muda quando alguém decide mudá-la.
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # includeSubDomains adicionado (achado P-12) — preload avaliado à parte e
    # NÃO incluído: submeter à hstspreload.org é efetivamente irreversível
    # (a remoção do domínio da lista embutida nos browsers leva meses a
    # propagar), e o domínio raiz ainda está em migração DNS+SSL (ver
    # frontend/CLAUDE.md) — não é o momento de tomar essa decisão.
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff            always;
    add_header X-Frame-Options           DENY               always;
    add_header Referrer-Policy           no-referrer-when-downgrade always;

    client_max_body_size 1m;

    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # Necessário para keepalive com upstream
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # SOBRESCREVE (não usa $proxy_add_x_forwarded_for, que ANEXA ao valor que o
    # cliente já mandou). Com append, um cliente que envia
    # "X-Forwarded-For: 1.2.3.4" chega no Go como "1.2.3.4, <ip real>" — e o
    # primeiro elemento (que o rate-limit e a auditoria liam) é forjável.
    # Sobrescrever com $remote_addr garante que o header sempre reflita quem
    # de fato conectou no nginx.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Se uma réplica falhar, tenta a próxima automaticamente (sem o usuário perceber)
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;

    # Health e readiness: sem rate limit
    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://api_backend;
    }

    # Métricas Prometheus: só a rede interna do Docker (172.16.0.0/12), nunca
    # a internet. O handler assume "rede interna" como premissa (ver
    # internal/interfaces/http/handlers/metrics_handler.go) e essa premissa só
    # é verdadeira se o proxy a impuser — a rota em si não tem auth.
    #
    # Achado P-15 (auditoria de 11/ago/2026): a faixa /12 inteira é mais larga
    # que necessário — qualquer container na rede `data` (api, postgres,
    # redis) consegue ler /metrics, não só um coletor. Decisão: MANTIDA por
    # ora, documentada em vez de restringida a um IP fixo, porque não existe
    # coletor Prometheus real rodando ainda (ver CLAUDE.md — "Fora de
    # escopo: não adiciona sistema de observabilidade novo"). Quando um
    # Prometheus/Grafana entrar no compose, trocar para `allow` do IP fixo
    # desse container e `deny all` do resto da faixa.
    location = /metrics {
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://api_backend;
    }

    # Stripe webhooks: rate limit generoso (achado P-10). A assinatura HMAC já
    # protege a lógica; isto protege CPU contra flood anônimo forçando o app
    # a computar HMAC sobre payload grande antes de rejeitar. Burst alto
    # absorve rajadas legítimas do Stripe sem bloquear evento real.
    location /api/v1/webhooks/ {
        limit_req zone=api_webhook burst=100 nodelay;
        proxy_pass http://api_backend;
    }

    # Auth: rate limit restrito (brute-force protection).
    # 10r/m por IP + burst 5 → 5 tentativas em rajada, depois 1 a cada 6s.
    location ~ ^/api/v1/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://api_backend;
    }

    # Todos os demais endpoints da API.
    # api_general: 600r/m (10 req/s sustentável) + burst 200 pra acomodar
    # paralelismo natural do cliente no boot.
    location / {
        limit_req zone=api_general burst=200 nodelay;
        proxy_pass http://api_backend;
    }
}
