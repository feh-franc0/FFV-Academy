version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - revive
    - gocritic
    - misspell
    - unconvert
    - unparam
    - gosec

linters-settings:
  goimports:
    local-prefixes: github.com/fernandofv/api
  revive:
    rules:
      - name: exported
      - name: var-naming
      - name: error-return
      - name: error-strings
      - name: increment-decrement
  gocritic:
    enabled-tags:
      - diagnostic
      - style
  gosec:
    # Exclusões documentadas:
    #   G401 — uso de SHA-1/MD5/DES: o projeto usa SHA-256 para certificados
    #          (determinístico) e tokens; os poucos usos de hashes não-criptográficos
    #          são para IDs/fingerprints internos, não para segurança.
    #   G501 — import blocklist para crypto/md5: idem acima. Aceitamos warning
    #          de low severity; qualquer novo uso passa por revisão de PR.
    excludes:
      - G401
      - G501

issues:
  exclude-rules:
    # Testes podem ter dependências externas
    - path: _test\.go
      linters:
        - errcheck
        - gosec
    # Mocks gerados
    - path: mock_
      linters:
        - all
