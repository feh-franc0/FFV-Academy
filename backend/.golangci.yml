version: "2"

run:
  timeout: 5m

# Política: lint focado em bugs reais e segurança.
# Style/naming (revive, gocritic) ficam para code review humano —
# evita bloquear CI por preferências de estilo.
linters:
  default: none
  enable:
    - errcheck      # erros não tratados
    - govet         # bugs comuns
    - ineffassign   # atribuições inúteis
    - staticcheck   # análise estática completa
    - unused        # código morto
    - gosec         # security warnings
  settings:
    gosec:
      # Exclusões documentadas:
      #   G401 — uso de SHA-1/MD5/DES: o projeto usa SHA-256 para certificados.
      #          Hashes não-criptográficos são para IDs/fingerprints internos.
      #   G501 — import blocklist para crypto/md5: idem acima.
      #   G115 — integer overflow conversion: tipos numericos sao validados
      #          em domain layer; expostos sao chi router params e dados de DB.
      #   G104 — coberto pelo errcheck (evita ruido duplicado).
      excludes:
        - G401
        - G501
        - G115
        - G104
        # G118 — goroutine usa context.Background/TODO em vez do request-scoped.
        # Intencional: audit log e event ingest sao fire-and-forget; precisam
        # sobreviver ao request lifetime (ate o flush). Padrao documentado.
        - G118
        # G101 — gera muitos falsos positivos em test fixtures e env var names
        # (ex: variavel chamada `SecretKey` com valor "sk_test_dummy").
        # Secrets reais nunca entram no codigo — uso obrigatorio de env vars.
        # CI tem step separado de scan de secrets que cobre essa categoria.
        - G101
  exclusions:
    rules:
      # Testes podem ter dependências externas e não tratam todos os erros
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      # Mocks gerados — desabilita tudo
      - path: mock_
        linters:
          - errcheck
          - gosec
          - unused
      # main.go pode chamar defer sem checar erro (shutdown)
      - path: cmd/api/main\.go
        linters:
          - errcheck

# Formatters (gofmt, goimports) — categoria separada em v2
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/fernandofv/api
